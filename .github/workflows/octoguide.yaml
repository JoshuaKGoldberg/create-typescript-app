jobs:
  octoguide:
    if: ${{ !endsWith(github.actor, '[bot]') }}
    permissions:
      discussions: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: JoshuaKGoldberg/octoguide@8d29abce6793b35c6bfab51d4db6bfa62634b871 # 0.33.1
        with:
          config: strict
          github-token: ${{ secrets.GITHUB_TOKEN }}

name: OctoGuide

on:
  discussion:
    types:
      - created
      - edited
  discussion_comment:
    types:
      - created
      - deleted
      - edited
  issue_comment: # zizmor: ignore[dangerous-triggers]
    types:
      - created
      - deleted
      - edited
  issues:
    types:
      - edited
      - opened
  pull_request_review_comment:
    types:
      - created
      - deleted
      - edited
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types:
      - edited
      - opened
