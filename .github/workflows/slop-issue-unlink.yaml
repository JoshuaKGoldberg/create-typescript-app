jobs:
  slop_issue_unlink:
    if: ${{ !github.event.pull_request.merged }}
    permissions:
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: JoshuaKGoldberg/slop-issue-unlink-action@346a2ebcee0728154050e233fd908ea2550bb93c # v0.3.0

name: Slop Issue Unlink

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types:
      - closed
      - labeled
