concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.event.number }}

jobs:
  slop_unlink_issues:
    if: github.event.pull_request.merged == false && (contains(github.event.pull_request.labels.*.name, 'agentscan:automated-account') || contains(github.event.pull_request.labels.*.name, 'agentscan:community-flagged') || contains(github.event.pull_request.labels.*.name, 'agentscan:mixed-signals') || contains(github.event.pull_request.labels.*.name, 'suspected ai slop'))
    permissions:
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        name: Unlink issues from slop PRs
        run: |
          issues=$(gh pr view "$PR" --repo "$REPO" --json closingIssuesReferences --jq '.closingIssuesReferences[].number')

          if [ -z "$issues" ]; then
            echo 'No linked issues.'
            exit 0
          fi

          echo "Unlinking: $issues"

          body=$(gh pr view "$PR" --repo "$REPO" --json body --jq .body)

          for issue in $issues; do
            body=$(printf '%s' "$body" | perl -pe "s/#$issue\b/#~$issue~/g")
          done

          gh pr edit "$PR" --repo "$REPO" --body "$body"

name: Slop Unlink Issues

on:
  pull_request_target:
    types:
      - closed
