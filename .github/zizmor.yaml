rules:
  dangerous-triggers:
    ignore:
      - agentscan.yaml
      - anti-slop.yaml
      - octoguide.yaml
      - pr-review-labels.yaml
      - slop-issue-unlink.yaml
  ref-confusion:
    ignore:
      - ci.yaml
  ref-version-mismatch:
    disable: true
  self-repository:
    disable: true
  unpinned-uses:
    config:
      policies:
        "*": ref-pin
